[project]
name = "document-extractor-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic-settings",
    "openai",
    "pymupdf",
    "rapidocr-onnxruntime",
    "python-docx",
    "openpyxl",
    "python-pptx",
    "pillow",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real OpenAI API; skipped without OPENAI_API_KEY"]
